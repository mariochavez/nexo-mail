<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inbox Briefing</title>
<style>
  :root{
    --bg:#f4f5f7;--surface:#fff;--surface-2:#f7f8fa;--border:#e7e9ee;--text:#1b2230;--muted:#5b6578;--faint:#8f98a9;
    --accent:#2f6fed;--accent-weak:#eaf1fd;--blue:#2f6fed;--blue-bg:#eaf1fd;--amber:#a8660f;--amber-bg:#fbf0dd;
    --green:#22824a;--green-bg:#e7f5ec;--purple:#6b4fd0;--purple-bg:#efeafb;--red:#c93b35;--red-bg:#fbe8e7;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --r:12px;--shadow:0 1px 2px rgba(20,24,40,.05),0 3px 10px rgba(20,24,40,.03);--bar:rgba(244,245,247,.86);
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#0f1116;--surface:#181b22;--surface-2:#1f232c;--border:#282d38;--text:#e9ebf0;--muted:#a3abba;--faint:#727a8a;
    --accent:#7ea5ff;--accent-weak:#1a2740;--blue:#7ea5ff;--blue-bg:#17233c;--amber:#e0a63a;--amber-bg:#2c2413;
    --green:#45c47e;--green-bg:#132a1e;--purple:#a48bf0;--purple-bg:#221d3a;--red:#f0706b;--red-bg:#2e1918;
    --shadow:0 1px 2px rgba(0,0,0,.3);--bar:rgba(15,17,22,.86);
  }}
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;scroll-padding-top:64px;}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto;}}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,p{margin:0;}
  button{font:inherit;cursor:pointer;color:inherit;background:none;border:0;padding:0;text-align:inherit;}
  a{color:var(--accent);text-decoration:none;}a:hover{text-decoration:underline;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px;}
  .wrap{max-width:1180px;margin:0 auto;padding:0 clamp(14px,3vw,28px) 40px;}
  .tnum{font-variant-numeric:tabular-nums;}

  /* ---- masthead: what happened, in one paragraph ---- */
  .mast{padding:22px 0 18px;}
  .mast .line{display:flex;align-items:center;justify-content:space-between;gap:10px 14px;flex-wrap:wrap;}
  .brand{font-size:14px;font-weight:720;letter-spacing:-.01em;}.brand .dot{color:var(--accent);}
  .srcs{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);}
  .src{display:inline-flex;align-items:center;gap:6px;}
  .src .d{width:6px;height:6px;border-radius:50%;background:var(--green);}
  .src.off{color:var(--faint);}.src.off .d{background:var(--faint);}
  .lead{font-size:clamp(18px,2.1vw,22px);line-height:1.38;font-weight:640;letter-spacing:-.012em;max-width:62ch;margin-top:16px;text-wrap:pretty;}

  /* ---- sticky bar: where you are, and search ---- */
  .bar{position:sticky;top:0;z-index:5;margin:0 calc(-1*clamp(14px,3vw,28px));padding:9px clamp(14px,3vw,28px);
    display:flex;align-items:center;gap:8px;background:var(--bar);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--border);}
  .tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;}.tabs::-webkit-scrollbar{display:none;}
  .tab{display:inline-flex;align-items:baseline;gap:6px;white-space:nowrap;font-size:13px;font-weight:620;color:var(--muted);padding:6px 10px;border-radius:8px;}
  .tab:hover{background:var(--surface);color:var(--text);text-decoration:none;}
  .tab b{font-weight:740;color:var(--text);font-variant-numeric:tabular-nums;}
  .tab.hot b{color:var(--blue);}.tab.warn b{color:var(--amber);}
  .tab[hidden]{display:none;}
  .find{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:6px 10px;flex:none;}
  .find svg{width:14px;height:14px;color:var(--faint);flex:none;}
  .find input{border:0;background:none;color:inherit;font:inherit;font-size:13.5px;width:170px;outline:none;min-width:0;}
  .find kbd{font:600 11px var(--mono);color:var(--faint);border:1px solid var(--border);border-radius:5px;padding:0 5px;}
  .find.has kbd{display:none;}.find button{color:var(--faint);font-size:14px;display:none;}.find.has button{display:block;}
  @media (max-width:620px){.find input{width:96px;}.find kbd{display:none;}}

  /* ---- layout: a reading column and a rail of things to glance at ---- */
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 336px;gap:20px;align-items:start;margin-top:18px;}
  .main,.rail{display:grid;gap:16px;min-width:0;}
  .rail{position:sticky;top:60px;max-height:calc(100vh - 72px);overflow-y:auto;scrollbar-width:thin;padding-bottom:2px;}
  @media (max-width:920px){.layout{grid-template-columns:1fr;}.rail{position:static;max-height:none;overflow:visible;}}
  .empty{display:none;color:var(--muted);font-size:14px;padding:24px 4px;}.empty.show{display:block;}

  .sec{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);min-width:0;}
  .sec[hidden]{display:none;}
  .sh{display:flex;align-items:baseline;gap:9px;padding:14px 18px 10px;}
  .sh h2{font-size:15px;font-weight:720;letter-spacing:-.01em;}
  .sh .k{width:8px;height:8px;border-radius:3px;flex:none;align-self:center;}
  .k.b{background:var(--blue);}.k.a{background:var(--amber);}.k.g{background:var(--green);}.k.p{background:var(--purple);}.k.n{background:var(--faint);}
  .sh .c{margin-left:auto;font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums;}
  .sb{padding:0 18px 6px;}
  .rail .sh{padding:12px 15px 8px;}.rail .sb{padding:0 15px 6px;}
  .morebtn{display:block;width:100%;text-align:center;font-size:13px;color:var(--accent);padding:11px;border-top:1px solid var(--border);font-weight:640;border-radius:0 0 var(--r) var(--r);}
  .morebtn:hover{background:var(--surface-2);}
  .x{display:none;}.open>.sb>.x,.searching .x{display:revert;}
  .searching .morebtn{display:none;}
  .pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;line-height:1.5;}
  .pill.red{color:var(--red);background:var(--red-bg);}.pill.amber{color:var(--amber);background:var(--amber-bg);}
  .pill.green{color:var(--green);background:var(--green-bg);}.pill.blue{color:var(--blue);background:var(--blue-bg);}
  .pill.plain{color:var(--muted);background:var(--surface-2);border:1px solid var(--border);}
  .meta{font-size:12.5px;color:var(--faint);}
  .clamp{display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;}
  .flash{animation:fl 1.2s ease;}@keyframes fl{0%{box-shadow:0 0 0 3px var(--accent-weak);}100%{box-shadow:var(--shadow);}}
  @media (prefers-reduced-motion:reduce){.flash{animation:none;}}

  /* ---- needs you ---- */
  .todo{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:start;padding:12px 0;border-top:1px solid var(--border);}
  .sb>.todo:first-child{border-top:0;}.todo.x{display:none;}.open>.sb>.todo.x,.searching .todo.x{display:grid;}
  .check{width:19px;height:19px;border:1.5px solid var(--faint);border-radius:6px;margin-top:1px;display:grid;place-items:center;color:#fff;transition:background .12s,border-color .12s;}
  .check:hover{border-color:var(--green);}
  .check svg{width:12px;height:12px;opacity:0;}
  .todo.done .check{background:var(--green);border-color:var(--green);}.todo.done .check svg{opacity:1;}
  .todo .tt{font-weight:640;font-size:15px;line-height:1.35;}
  .todo .ts{color:var(--muted);font-size:14px;margin-top:2px;max-width:70ch;}
  .todo .meta{margin-top:4px;}
  .todo.done .tt{text-decoration:line-through;color:var(--faint);font-weight:500;}.todo.done .ts,.todo.done .meta{display:none;}
  .todo.done{padding:8px 0;}
  .allclear{color:var(--muted);font-size:14px;padding:6px 0 14px;}

  /* ---- radar + threads: a masonry of short cards, so no row leaves a hole ---- */
  .cols{columns:2 300px;column-gap:14px;padding:2px 18px 12px;}
  .tile{break-inside:avoid;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:13px 14px 12px;margin:0 0 12px;}
  .tile[hidden]{display:none;}
  .tile .t{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:720;color:var(--purple);}
  .tile .t .n{color:var(--faint);font-weight:600;letter-spacing:0;text-transform:none;font-size:12px;}
  .tile .h{font-weight:660;font-size:15px;line-height:1.35;margin-top:4px;}
  .tile ul{margin:8px 0 0;padding-left:17px;color:var(--muted);font-size:13.5px;line-height:1.45;}
  .tile li{margin:3px 0;}.tile li.x{display:none;}.tile.open li.x,.searching .tile li.x{display:list-item;}
  .tile .b{color:var(--muted);font-size:13.5px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border);display:none;}
  .tile.open .b,.searching .tile .b{display:block;}
  .tile .n3{color:var(--muted);font-size:13.5px;line-height:1.5;margin-top:5px;-webkit-line-clamp:4;}
  .tile.open .n3,.searching .tile .n3{-webkit-line-clamp:unset;display:block;}
  .tile .more{font-size:12.5px;color:var(--accent);margin-top:8px;font-weight:640;}
  .searching .tile .more{display:none;}
  .tile.story .t{color:var(--muted);}
  .tile .from{margin-top:8px;}

  /* ---- also worth knowing: a dense list you scan ---- */
  .row{display:grid;grid-template-columns:132px minmax(0,1fr) auto;gap:2px 14px;align-items:baseline;padding:9px 0;border-top:1px solid var(--border);}
  .sb>.row:first-child{border-top:0;}.row[hidden]{display:none !important;}
  .row.x{display:none;}.open>.sb>.row.x,.searching .row.x{display:grid;}
  .row .who{font-weight:640;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row .subj{font-size:14px;line-height:1.35;-webkit-line-clamp:1;}
  .row .sum{color:var(--muted);font-size:13px;line-height:1.4;margin-top:1px;-webkit-line-clamp:2;}
  .row .age{font-size:12px;color:var(--faint);white-space:nowrap;font-variant-numeric:tabular-nums;}
  @media (max-width:620px){.row{grid-template-columns:minmax(0,1fr) auto;}.row .who{grid-column:1;}.row .body{grid-column:1 / -1;}}

  /* ---- rail: schedule, money, people ---- */
  .ev{display:grid;grid-template-columns:52px minmax(0,1fr);gap:11px;align-items:start;padding:10px 0;border-top:1px solid var(--border);}
  .sb>.ev:first-child{border-top:0;}.ev[hidden]{display:none;}
  .ev .d{text-align:center;background:var(--green-bg);color:var(--green);border-radius:8px;padding:5px 2px 6px;line-height:1.1;}
  .ev .d .mo{font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;}
  .ev .d .dy{font-size:18px;font-weight:740;font-variant-numeric:tabular-nums;}
  .ev .w{font-weight:640;font-size:14px;line-height:1.3;}.ev .m{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .ev .pill{display:inline-block;margin-top:5px;}
  .cur{padding:10px 0 12px;border-top:1px solid var(--border);}.sb>.cur:first-child{border-top:0;padding-top:2px;}
  .cur .code{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;font-weight:720;letter-spacing:.08em;color:var(--muted);}
  .cur .code span:last-child{font-weight:500;letter-spacing:0;color:var(--faint);font-size:12px;}
  .figs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px;}
  .fig .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);}
  .fig .v{font-size:14.5px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .fig.due.on .v{color:var(--amber);}.fig.zero .v{color:var(--faint);font-weight:600;}
  .lines{margin-top:9px;font-size:12.5px;color:var(--muted);}
  .lines .cap{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin:9px 0 3px;}
  .lines .s{display:flex;justify-content:space-between;gap:10px;padding:2px 0;}
  .lines .s span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .lines .a{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--text);}
  .bars{padding:10px 0 10px;border-top:1px solid var(--border);}
  .bars .cap{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin-bottom:6px;}
  .mv{margin:8px 0 0;}.mv .l{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;}
  .mv .l span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .mv .l .a{font-variant-numeric:tabular-nums;white-space:nowrap;}
  .mv .t{height:5px;background:var(--surface-2);border-radius:4px;overflow:hidden;margin-top:4px;}
  .mv .f{height:100%;background:var(--amber);border-radius:4px;opacity:.8;}
  .person{padding:10px 0;border-top:1px solid var(--border);}.sb>.person:first-child{border-top:0;}.person[hidden]{display:none;}
  .person .n{font-weight:660;font-size:14px;}
  .person .r{font-size:12px;color:var(--faint);margin-top:1px;-webkit-line-clamp:1;}
  .person .note{color:var(--muted);font-size:13px;line-height:1.45;margin-top:4px;-webkit-line-clamp:3;}
  .person.open .note,.person.open .r,.searching .person .note{-webkit-line-clamp:unset;display:block;}
  .person .note{cursor:pointer;}

  footer{margin-top:22px;color:var(--faint);font-size:12px;display:flex;flex-wrap:wrap;gap:6px 16px;}
  @media print{.bar{position:static;}.find,.morebtn,.more{display:none !important;}.rail{position:static;max-height:none;overflow:visible;}
    .x,.tile li.x,.tile .b{display:revert !important;}.todo.x,.row.x{display:grid !important;}.sec{box-shadow:none;break-inside:avoid;}}
</style>

<div class="wrap" id="app"></div>
<script type="application/json" id="digest-data">__DIGEST_JSON__</script>
<script>

  // ---------- sections ----------

    return sec("radar","p","Radar",topics.length+(topics.length===1?" topic":" topics"),cols);
  }
  function threadSec(){
    var cols=el("div",{class:"cols"});
    stories.forEach(function(st){
      var node=el("article",{class:"tile story","data-s":""},
        st.tag?el("div",{class:"t"},el("span",null,st.tag)):null,
        el("div",{class:"h"},st.title||"Thread"),
        st.narrative?el("div",{class:"n3 clamp"},st.narrative):null);
      var subjects=A(st.item_subjects);
      if(String(st.narrative||"").length>230)node.appendChild(toggle(node,"Read more","Show less"));
      if(subjects.length)node.appendChild(el("div",{class:"meta from",title:subjects.join("\n")},
        "From "+subjects.length+(subjects.length===1?" message":" messages")));
      cols.appendChild(node);});
    return sec("threads","n","Threads worth following",String(stories.length),cols);
  }
  function toggle(node,closed,opened){
    var m=el("button",{class:"more","aria-expanded":"false"},closed);
    m.addEventListener("click",function(){var o=node.classList.toggle("open");m.setAttribute("aria-expanded",o?"true":"false");m.textContent=o?opened:closed;});
    return m;
  }
  function fyiSec(){
    var LIMIT=8, sb=el("div",{class:"sb"}), s;
    fyi.forEach(function(it,i){
      sb.appendChild(el("div",{class:"row"+(i>=LIMIT?" x":""),"data-s":""},
        el("div",{class:"who",title:it.sender||""},it.sender||"(unknown)"),
        el("div",{class:"body"},el("div",{class:"subj clamp",title:it.subject||""},it.subject||"(no subject)"),
          it.summary?el("div",{class:"sum clamp"},it.summary):null),
        el("div",{class:"age"},ago(it.received_at))));});
    s=sec("fyi","n","Also worth knowing",String(fyi.length),sb,expander(function(){return s;},fyi.length-LIMIT));
    return s;
  }

  function schedSec(){
    var sb=el("div",{class:"sb"});
    sched.forEach(function(e){
      var d=parseDate(e.start), range=fmtRange(e.start,e.end);
      var where=[range,e.location].filter(Boolean).join(" · ");
      sb.appendChild(el("div",{class:"ev","data-s":""},
        el("div",{class:"d"},el("div",{class:"mo"},d?d.toLocaleDateString(undefined,{month:"short"}):"TBD"),
          el("div",{class:"dy"},d?d.getDate():"·")),
        el("div",null,el("div",{class:"w"},e.title||e.subject||"Event"),

          e.rsvp?el("span",{class:"pill red"},"Needs your RSVP"):el("span",{class:"pill green"},"Confirmed"))));});
    return sec("schedule","g","Schedule",sched.length+(sched.length===1?" event":" events"),sb);
  }

  // Charges for one currency: the nested shape (by_currency[c].charges) if present,
  // else the older flat finance.charges filtered down to that currency.
  function curCharges(c){var b=byCur[c]||{};return A(b.charges).length?A(b.charges):A(fin.charges).filter(function(x){return (x.currency||dom)===c;});}
  // Biggest spender first. NEVER summed across currencies — there is no rate here.
  function curOrder(){
    var keys=A(fin.currencies).length?A(fin.currencies).slice():Object.keys(byCur);
    if(!keys.length&&A(fin.charges).length){keys=A(fin.charges).map(function(x){return x.currency||dom;}).filter(function(v,i,a){return v&&a.indexOf(v)===i;});}
    return keys.sort(function(a,b){return outOf(byCur[b])-outOf(byCur[a]);});
  }
  function outOf(t){t=t||{};return t.out!=null?t.out:(t.charged||0)+(t.due||0)+(t.paid||0);}
  function fig(label,amount,c,cls){var n=Number(amount)||0;
    return el("div",{class:"fig "+(cls||"")+(n?" on":" zero")},el("div",{class:"l"},label),el("div",{class:"v"},n?money(n,c):"—"));}
  function moneySec(){
    var sb=el("div",{class:"sb"}), order=curOrder();
    order.forEach(function(c){
      var t=byCur[c]||{}, rows=curCharges(c);
      var block=el("div",{class:"cur","data-s":""},
        el("div",{class:"code"},el("span",null,c),el("span",null,rows.length+(rows.length===1?" item":" items"))),
        el("div",{class:"figs"},fig("Due",t.due,c,"due"),fig("Charged",t.charged,c),fig("Paid",t.paid,c)));
      var lines=el("div",{class:"lines"});
      if(t.refund){lines.appendChild(el("div",{class:"s"},el("span",null,"Received / refunded"),el("span",{class:"a"},money(t.refund,c))));}
      var subs=rows.filter(function(x){return x.kind==="subscription";});
      if(subs.length){lines.appendChild(el("div",{class:"cap"},"Subscriptions"));
        subs.forEach(function(u){lines.appendChild(el("div",{class:"s"},el("span",{title:u.merchant||""},u.merchant||"—"),el("span",{class:"a"},money(u.amount,c))));});}
      if(lines.childNodes.length)block.appendChild(lines);
      sb.appendChild(block);});
    var bars=A(fin.chart&&fin.chart.bars);
    if(bars.length){var max=Math.max.apply(null,bars.map(function(b){return Number(b.amount)||0;}).concat([1]));
      var wrap=el("div",{class:"bars"},el("div",{class:"cap"},"Biggest movements"+(fin.chart.currency?" · "+fin.chart.currency:"")));
      bars.forEach(function(b){var w=Math.max(3,Math.round((Number(b.amount)||0)/max*100));
        wrap.appendChild(el("div",{class:"mv"},el("div",{class:"l"},el("span",{title:b.label||""},b.label||"—"),el("span",{class:"a"},money(b.amount,fin.chart.currency))),
          el("div",{class:"t"},el("div",{class:"f",style:"width:"+w+"%"}))));});
      sb.appendChild(wrap);}
    return sec("money","a","Money",order.length>1?order.length+" currencies":null,sb);
  }
  function peopleSec(){
    var sb=el("div",{class:"sb"});
    people.forEach(function(p){
      var node=el("div",{class:"person","data-s":""},
        el("div",{class:"n"},p.name||"Someone"),
        p.relationship?el("div",{class:"r clamp",title:p.relationship},p.relationship):null,
        p.note?el("div",{class:"note clamp",title:"Click to expand"},p.note):null);
      node.addEventListener("click",function(){node.classList.toggle("open");});
      sb.appendChild(node);});
    return sec("people","n","People",String(people.length),sb);
  }

  // ---------- sticky tabs ----------
  function buildTabs(){
    function tab(id,label,value,cls){if(!document.getElementById("sec-"+id))return;
      tabs.appendChild(el("a",{class:"tab"+(cls?" "+cls:""),href:"#sec-"+id,"data-tab":id},value!=null?el("b",null,value):null,label));}
    tab("todos","need you",String(action.length),"hot");
    var due=totalDue();
    tab("money",due?"due":"Money",due?money(due.amount,due.currency):null,due?"warn":"");
    tab("schedule",sched.length===1?"event":"events",String(sched.length));
    tab("radar","Radar",String(topics.length));
    tab("threads","Threads",String(stories.length));
    tab("fyi","FYI",String(fyi.length));
    tab("people","People",String(people.length));
  }
  function totalDue(){if(!dom||!byCur[dom])return null;var d=Number(byCur[dom].due)||0;return d>0?{amount:d,currency:dom}:null;}
  function recount(){
    var left=action.length-app.querySelectorAll(".todo.done").length;
    var c=app.querySelector("#sec-todos .sh .c");
    if(c)c.textContent=!action.length?"":(left===0?"All done":left+" of "+action.length+" left");
    var b=app.querySelector('.tab[data-tab="todos"] b');if(b)b.textContent=String(Math.max(0,left));
  }

  // ---------- helpers ----------
  function todoId(it,i){return (it.subject||"")+"|"+(it.received_at||i);}
  function loadDone(){try{return JSON.parse(localStorage.getItem(storeKey)||"{}")||{};}catch(e){return {};}}
  function saveDone(){try{localStorage.setItem(storeKey,JSON.stringify(done));}catch(e){}}
  // A date-only string ("2026-12-14") is a calendar day, not midnight UTC: build it
  // in local time, or it shows as the day before west of Greenwich.
  function parseDate(s){if(!s)return null;var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s));
    var d=m?new Date(+m[1],+m[2]-1,+m[3]):new Date(s);return isNaN(d)?null:d;}
  function hasTime(s){return /T\d{2}:\d{2}/.test(String(s||""));}
  function fmtDate(s){var d=parseDate(s);if(!d)return s?String(s).slice(0,16).replace("T"," "):"";
    return d.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short",year:"numeric"});}
  function fmtRange(a,b){var x=parseDate(a),y=parseDate(b);if(!x)return "";
    var o={weekday:"short",day:"numeric",month:"short"};
    var out=x.toLocaleDateString(undefined,o);
    if(hasTime(a))out+=", "+x.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
    if(y&&y.toDateString()!==x.toDateString())out+=" – "+y.toLocaleDateString(undefined,o);
    return out;}
  function ago(s){var d=parseDate(s);if(!d)return "";var days=Math.floor((now-d)/864e5);
    if(days<0)return "";if(days===0)return "today";if(days===1)return "yesterday";if(days<14)return days+"d ago";
    return d.toLocaleDateString(undefined,{day:"numeric",month:"short"});}
  function searchIcon(){var s=svg();s.appendChild(shape("circle",{cx:11,cy:11,r:7}));s.appendChild(shape("path",{d:"M21 21l-4.3-4.3"}));return s;}
  function checkIcon(){var s=svg();s.setAttribute("stroke-width","3");s.appendChild(shape("path",{d:"M5 12l5 5L20 6"}));return s;}
  function svg(){var s=document.createElementNS("http://www.w3.org/2000/svg","svg");s.setAttribute("viewBox","0 0 24 24");s.setAttribute("fill","none");s.setAttribute("stroke","currentColor");s.setAttribute("stroke-width","2");s.setAttribute("stroke-linecap","round");s.setAttribute("aria-hidden","true");return s;}
  function shape(tag,attrs){var n=document.createElementNS("http://www.w3.org/2000/svg",tag);for(var k in attrs)n.setAttribute(k,attrs[k]);return n;}

  function wire(){
    var secs=[].slice.call(document.querySelectorAll(".sec"));
    function norm(s){return (s||"").toLowerCase();}
    function apply(){
      var query=norm(q.value.trim()), any=false;
      find.classList.toggle("has",query.length>0);
      app.classList.toggle("searching",query.length>0);
      secs.forEach(function(sc){
        var items=[].slice.call(sc.querySelectorAll("[data-s]")), shown=0;
        items.forEach(function(r){var m=!query||norm(r.textContent).indexOf(query)!==-1;r.hidden=!m;if(m)shown++;});
        sc.hidden=shown===0&&items.length>0;if(!sc.hidden)any=true;
        var t=tabs.querySelector('[data-tab="'+sc.getAttribute("data-sec")+'"]');if(t)t.hidden=sc.hidden;});
      emptyMsg.textContent=any?"":'Nothing in this briefing matches "'+q.value.trim()+'".';
      emptyMsg.classList.toggle("show",!any);
    }
    q.addEventListener("input",apply);
    q.addEventListener("keydown",function(e){if(e.key==="Escape"){q.value="";apply();q.blur();}});
    clr.addEventListener("click",function(){q.value="";q.focus();apply();});
    document.addEventListener("keydown",function(e){
      if(e.key==="/"&&document.activeElement!==q&&!e.metaKey&&!e.ctrlKey){e.preventDefault();q.focus();q.select();}});
    tabs.addEventListener("click",function(e){var a=e.target.closest?e.target.closest(".tab"):null;if(!a)return;
      var s=document.getElementById(a.getAttribute("href").slice(1));
      if(s){s.classList.remove("flash");void s.offsetWidth;s.classList.add("flash");}});
  }
})();
</script>
