# Nexo Mail Agent configuration.
#
# Precedence for every setting:  NEXO_MAIL_* env var  >  this file  >  built-in default.
# Any string value may reference an env var:  "${VAR}"  or  "${VAR:-fallback}".
#
# This file was created on first run. Edit it, then run `nexo-triage`.

# ── Models ──────────────────────────────────────────────────────────────────
# There is NO default model. Define one or more [[models]]; the FIRST is used
# unless you pass  `nexo-triage --model <alias>`  (or set NEXO_MAIL_MODEL=<alias>).
#
# Each model needs: an alias, a provider ruby_llm knows (ollama, openai,
# anthropic, gemini, mistral, deepseek, azure, …), the model id, and optional
# api_base / api_key for that provider. Uncomment and edit:
#
# [[models]]
# alias    = "local"
# provider = "ollama"
# model    = "llama3.1"
# api_base = "http://localhost:11434/v1"
# api_key  = ""
#
# [[models]]
# alias    = "glm-cloud"
# provider = "ollama"
# model    = "glm-5.2:cloud"
# api_base = "https://ollama.com/v1"
# api_key  = "${OLLAMA_API_KEY}"

# ── Services ────────────────────────────────────────────────────────────────
[services.gmail]
# Read-only IMAP with an App Password (no gcloud). See `nexo-triage --help`.
address      = "${GMAIL_ADDRESS}"
app_password = "${GMAIL_APP_PASSWORD}"

[services.apple_mail]
# The local apple-mail-mcp server (must be on PATH and indexed).
mcp_command = "apple-mail-mcp"

[services.hey]
# HEY uses the `hey` CLI's own auth (keyring); nothing to set here.

# ── Theme ───────────────────────────────────────────────────────────────────
[theme]
# Catppuccin flavor for the terminal UI and the digest markdown.
# One of: latte (light), frappe, macchiato, mocha (dark).
flavor = "mocha"

# ── Snapshots ───────────────────────────────────────────────────────────────
# Every run archives its artifacts (digest.json, dashboard.html, inbox-digest.md)
# into a timestamped snapshot. `nexo-triage --prune-snapshots` trims the history.
# snapshots_keep = 20

# ── Dashboard ───────────────────────────────────────────────────────────────
# The Publisher renders dashboard.html from a template + a render script. Both are
# AUTO-RESOLVED from the skill the Publisher declares — ruby_llm-skills finds that
# skill's assets/ and scripts/ — so you only need these settings to OVERRIDE them.
# Point `template` at your own HTML to restyle the dashboard without touching the
# gem; the render script injects the run's digest.json into the template's
# `__DIGEST_JSON__` placeholder.
# The Publisher runs the render script inside a sandbox shell with a narrowed PATH.
# If your Ruby is version-managed (mise/asdf/rbenv) and `ruby` won't resolve there,
# pin `ruby` to an absolute interpreter path.
#
# WHERE it renders is `sandbox`: "local" (default — the shared workspace, same as
# every other agent) or "docker" / "apple" (a throwaway container with no network,
# dropped capabilities and a read-only rootfs). The Publisher is the only agent
# holding a shell and it reaches no mail, so containerizing it costs the pipeline
# nothing. In a container the interpreter comes from the `image` — `ruby` below
# applies to the local sandbox only, and an absolute `template`/`renderer` override
# is ignored there because a host path does not exist inside the container.
# `nexo-triage --check` probes whichever of these you pick.
# [dashboard]
# sandbox  = "local"          # local | docker | apple
# image    = "ruby:3.3-slim"  # containerized runs only
# ruby     = "ruby"
# template = "${XDG_CONFIG_HOME:-~/.config}/nexo-mail/skills/dashboard_designer/assets/dashboard-template.html"
# renderer = "${XDG_CONFIG_HOME:-~/.config}/nexo-mail/skills/dashboard_designer/scripts/render_dashboard.rb"

# ── Reading (optional) ──────────────────────────────────────────────────────
# How much mail the source tools pull, and how much of each message they hand
# the model. Every value is clamped, and a non-numeric value falls back to the
# default. Each also has a NEXO_MAIL_<UPPERCASE_KEY> env var that wins over the
# TOML.
#
# The listings already carry a snippet, so triage rarely needs to open a
# message — these caps are what keep a run from turning into one tool call per
# email. Lower them on a small-context model; raise them for a fuller picture.
# [read]
# gmail_list_limit      = 40      # messages in one INBOX listing        (1..200)
# gmail_snippet_chars   = 400     # snippet per listed message; 0 = off  (0..2000)
# gmail_read_max_uids   = 25      # UIDs one batched body read accepts   (1..100)
# gmail_body_chars      = 4000    # body chars per message read          (200..20000)
# hey_box_limit         = 40      # postings per HEY box                 (1..200)
# hey_snippet_chars     = 200     # HEY caps its own summary at 200      (0..1000)
# hey_thread_max_ids    = 15      # ids one batched thread read accepts  (1..50)
# hey_body_chars        = 4000    # body chars per HEY thread entry      (200..20000)
# hey_payload_max_chars = 40000   # ceiling on a whole thread-read reply (4000..200000)
# hey_concurrency       = 1       # `hey` fan-out tasks per tool call (1..8)
#                                 # Leave at 1: `hey` cannot run concurrently (it
#                                 # races on the macOS keyring), so nexo_mail holds
#                                 # a mutex across every invocation. Raising this
#                                 # only queues fibers behind that lock.
#
# How ruby_llm runs MULTIPLE tool calls emitted in one assistant turn:
#   "fibers"  (default) — via async, the same reactor the sources fan out in
#   "threads"           — OS threads
#   "off"               — one at a time
# tool_concurrency      = "fibers"
# apple_body_chars      = 4000    # cap Apple Mail MCP's untruncated body (200..20000)


# ── Paths (optional) ────────────────────────────────────────────────────────
# Defaults follow XDG:
#   sandbox_dir   : $XDG_STATE_HOME/nexo-mail/sandbox    (~/.local/state/nexo-mail/sandbox)
#   snapshots_dir : $XDG_STATE_HOME/nexo-mail/snapshots  (~/.local/state/nexo-mail/snapshots)
#   skills_dir    : $XDG_CONFIG_HOME/nexo-mail/skills     (~/.config/nexo-mail/skills)
#   prompts_dir   : $XDG_CONFIG_HOME/nexo-mail/prompts    (~/.config/nexo-mail/prompts)
# Uncomment to override:
# sandbox_dir   = "~/nexo-mail/sandbox"
# snapshots_dir = "~/nexo-mail/snapshots"
# skills_dir    = "~/nexo-mail/skills"
# prompts_dir   = "~/nexo-mail/prompts"
